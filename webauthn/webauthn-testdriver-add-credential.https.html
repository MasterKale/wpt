<!DOCTYPE html>
<title>Successful WebAuthn tests</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="resources/common-inputs.js"></script>
<script src="resources/utils.js"></script>

<script>
"use strict";

let passkeyPlatformAuthenticator;

promise_test(async t => {
  /** An authenticator that is likely to do synced passkeys */
  passkeyPlatformAuthenticator = await window.test_driver.add_virtual_authenticator({
    protocol: "ctap2_1",
    transport: "internal",
    hasResidentKey: true,
    hasUserVerification: true,
  });
}, "Set up the test environment");

let credential;
let publicKey;

promise_test(async t => {
  /**
   * Test support for `signCount: null` in the Add Credential API, which is being added in
   * https://github.com/w3c/webauthn/pull/2382
   */
  const credentialId = "Y3JlZC0w";
  
  // Invoke Add Credential w/`signCount: null`
  const privateKey =
      "MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg8_zMDQDYAxlU-Q"
    + "hk1Dwkf0v18GZca1DMF3SaJ9HPdmShRANCAASNYX5lyVCOZLzFZzrIKmeZ2jwU"
    + "RmgsJYxGP__fWN_S-j5sN4tT15XEpN_7QZnt14YvI6uvAgO0uJEboFaZlOEB";
  await window.test_driver.add_credential(passkeyPlatformAuthenticator, {
      credentialId,
      rpId: window.location.hostname,
      privateKey,
      signCount: null,
      isResidentCredential: true,
      userHandle: '4dGAstylmVI',
  });

  // Auth with the credential
  let assertion = await navigator.credentials.get({
    publicKey: {
      challenge: new TextEncoder().encode(CHALLENGE),
      rpId: window.location.hostname,
      allowCredentials: [{
        type: "public-key",
        id: new Uint8Array([...base64urlDecode(credentialId)].map(c => c.charCodeAt(0))),
        transports: ["internal"],
      }],
      userVerification: "discouraged",
    },
  });

  let binaryAuthenticatorData = new Uint8Array(assertion.response.authenticatorData);
  let authenticatorData = parseAuthenticatorData(binaryAuthenticatorData);

  // Make sure that signCount did not increment
  assert_equals(authenticatorData.signCount, 0);
}, "Test that null signCount in Add Credential yields constant 0 signCount on assertion");

promise_test(async t => {
  await window.test_driver.remove_virtual_authenticator(passkeyPlatformAuthenticator);
}, "Clean up the test environment");

</script>
